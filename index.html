<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D/2D GPS & AI Navigation</title>

  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #0284c7;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* OSD Bar */
    .osd-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      background: rgba(0,0,0,0.9);
      color: #00ffcc;
      font-family: monospace;
      font-size: 11px;
      z-index: 2000;
    }

    /* AI Companion Banner */
    .ai-banner {
      background: #1e1b4b;
      color: #a7f3d0;
      padding: 6px 12px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #312e81;
      z-index: 1600;
    }

    /* Search Bar */
    .search-container {
      position: relative;
      background: var(--card-bg);
      z-index: 1500;
      border-bottom: 1px solid var(--border-color);
    }
    .search-box {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
    }
    .search-box input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: rgba(0,0,0,0.3);
      color: var(--text-color);
      font-size: 13px;
    }

    .suggestions-list {
      display: none;
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: var(--card-bg);
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      z-index: 2500;
    }
    .suggestion-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      font-size: 12px;
      cursor: pointer;
    }

    /* Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 4px 6px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }
    .card {
      background: rgba(0,0,0,0.2);
      padding: 4px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid var(--border-color);
    }
    .card.main {
      grid-column: span 4;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 6px;
    }
    .card .label { font-size: 9px; opacity: 0.8; }
    .card .value { font-size: 16px; font-weight: 800; }
    .card.main .value { font-size: 32px; font-weight: 900; }

    /* Controls */
    .controls {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      background: var(--card-bg);
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
    }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
    }
    .btn.primary { background: #22c55e; }
    .btn.stop { background: #ef4444; }
    .btn.ai-active { background: #8b5cf6; }
    .btn.ai-listening { background: #ec4899; animation: pulse 1s infinite; }
    .btn.mode-active { background: #0284c7; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* Map Viewport */
    .viewport { flex: 1; position: relative; width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; background: #090d16; }

    .vehicle-icon {
      font-size: 28px;
      text-align: center;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6));
    }
  </style>
</head>
<body>

  <!-- OSD Overlay -->
  <div class="osd-bar">
    <span id="osd-datetime">00/00/0000 00:00:00</span>
    <span id="osd-view-mode">มุมมอง: 3D เอียง</span>
    <span id="osd-status">GPS Ready</span>
  </div>

  <!-- AI Companion Bar -->
  <div class="ai-banner">
    <span>🤖 AI: <strong id="ai-status-text">ปิดอยู่</strong></span>
    <button class="btn ai-active" id="btn-ai-toggle" onclick="toggleAIAssistant()">🎙️ เปิดโหมดฟังค้าง</button>
  </div>

  <!-- Search Container -->
  <div class="search-container">
    <div class="search-box">
      <input type="text" id="dest-input" placeholder="พิมพ์สถานที่ หรือพูด 'นำทางไป...'" onkeypress="if(event.key==='Enter') searchDestination()">
      <button class="btn primary" onclick="searchDestination()">🔍 ค้นหา</button>
      <button class="btn stop" onclick="cancelNavigation()">ยกเลิก</button>
    </div>
    <div id="suggestions" class="suggestions-list"></div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard">
    <div class="card main">
      <div class="label">SPEED</div>
      <div class="value" id="speed">0.0</div>
      <span style="font-size: 9px;">km/h</span>
    </div>
    <div class="card"><div class="label">MAX</div><div class="value" id="max-speed">0.0</div></div>
    <div class="card"><div class="label">HEADING</div><div class="value" id="heading-val">0°</div></div>
    <div class="card"><div class="label">ALT</div><div class="value" id="altitude">--</div></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn mode-active" id="btn-toggle-view" onclick="toggleMapView()">🧊 มุมมอง 3D</button>
    <button class="btn primary" id="toggle-btn" onclick="toggleTracking()">START TRACKING</button>
    <button class="btn" onclick="speakCurrentLocation()">🗣️ บอกตำแหน่ง</button>
    <button class="btn" style="background:#64748b;" onclick="location.reload()">🔄 รีเซ็ตแอป</button>
  </div>

  <!-- Map -->
  <div class="viewport">
    <div id="map"></div>
  </div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <script>
    let currentLat = 13.7563, currentLng = 100.5018;
    let currentHeading = 0, currentSpeed = 0, maxSpeed = 0;
    let is3DView = true;
    let isTracking = false;
    let watchId = null;
    let isAIActive = false;
    let recognition = null;
    let isProcessingCommand = false;

    // 1. สร้างแผนที่ MapLibre GL (เริ่มต้นโหมด 3D)
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [currentLng, currentLat],
      zoom: 17.5,
      pitch: 60,   // เอียง 60° แบบ 3D
      bearing: 0
    });

    // Marker รถยนต์
    const vehicleEl = document.createElement('div');
    vehicleEl.className = 'vehicle-icon';
    vehicleEl.innerText = '🚗';
    const vehicleMarker = new maplibregl.Marker({ element: vehicleEl })
      .setLngLat([currentLng, currentLat])
      .addTo(map);

    // 2. สลับมุมมองระหว่าง 3D (เอียง+หมุนตามรถ) กับ 2D (แผนที่ธรรมดา)
    function toggleMapView() {
      is3DView = !is3DView;
      const btn = document.getElementById('btn-toggle-view');
      const osdView = document.getElementById('osd-view-mode');

      if (is3DView) {
        btn.innerText = "🧊 มุมมอง 3D";
        btn.classList.add('mode-active');
        osdView.innerText = "มุมมอง: 3D เอียง";
        map.easeTo({ pitch: 60, bearing: currentHeading, zoom: 17.5, duration: 800 });
      } else {
        btn.innerText = "🗺️ มุมมอง 2D ธรรมดา";
        btn.classList.remove('mode-active');
        osdView.innerText = "มุมมอง: 2D แผนที่ธรรมดา";
        map.easeTo({ pitch: 0, bearing: 0, zoom: 16, duration: 800 });
      }
    }

    // 3. ระบบ AI เสียง
    function aiSpeak(text, callback) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'th-TH';
        u.rate = 1.0;
        u.onend = () => { if (callback) callback(); };
        u.onerror = () => { if (callback) callback(); };
        window.speechSynthesis.speak(u);
      } else {
        if (callback) callback();
      }
    }

    function initSpeechEngine() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("เบราว์เซอร์นี้ไม่รองรับการฟังเสียงอัตโนมัติ");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'th-TH';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        document.getElementById('ai-status-text').innerText = "กำลังฟัง...";
        const btn = document.getElementById('btn-ai-toggle');
        btn.classList.add('ai-listening');
        btn.innerText = "🔴 AI กำลังฟังอยู่ (กดปิด)";
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript.trim();
        document.getElementById('ai-status-text').innerText = `ได้ยิน: "${text}"`;
        processVoiceCommand(text);
      };

      recognition.onend = () => {
        const btn = document.getElementById('btn-ai-toggle');
        btn.classList.remove('ai-listening');

        if (isAIActive && !isProcessingCommand) {
          setTimeout(() => { try { recognition.start(); } catch(e) {} }, 300);
        } else if (!isAIActive) {
          document.getElementById('ai-status-text').innerText = "ปิดอยู่";
          btn.innerText = "🎙️ เปิดโหมดฟังค้าง";
        }
      };
    }

    function toggleAIAssistant() {
      if (!recognition) initSpeechEngine();

      if (!isAIActive) {
        isAIActive = true;
        aiSpeak("เปิดโหมด AI เพื่อนเดินทางแล้ว พูดสั่งนำทางได้เลยครับ", () => {
          try { recognition.start(); } catch(e) {}
        });
      } else {
        isAIActive = false;
        try { recognition.stop(); } catch(e) {}
        aiSpeak("ปิดระบบฟังเสียงเรียบร้อยครับ");
      }
    }

    function processVoiceCommand(text) {
      isProcessingCommand = true;
      const lowerText = text.toLowerCase();

      if (lowerText.includes("นำทางไป") || lowerText.includes("ไปที่") || lowerText.includes("ไป")) {
        let dest = text.replace(/นำทางไป|ไปที่|ไป/g, "").trim();
        if (dest.length > 0) {
          document.getElementById('dest-input').value = dest;
          aiSpeak(`กำลังค้นหาเส้นทางไป ${dest}`, () => searchDestinationDirect(dest));
        } else { resumeListening(); }
      } else if (lowerText.includes("อยู่ที่ไหน") || lowerText.includes("ตำแหน่ง")) {
        speakCurrentLocation(() => resumeListening());
      } else if (lowerText.includes("ยกเลิก") || lowerText.includes("หยุดนำทาง")) {
        cancelNavigation();
        aiSpeak("ยกเลิกการนำทางแล้วครับ", () => resumeListening());
      } else {
        setTimeout(() => resumeListening(), 1000);
      }
    }

    function resumeListening() {
      isProcessingCommand = false;
      if (isAIActive) { try { recognition.start(); } catch(e) {} }
    }

    // 4. ระบบค้นหาแบบยืดหยุ่น
    async function searchDestination() {
      const query = document.getElementById('dest-input').value;
      if (!query.trim()) return;
      searchDestinationDirect(query);
    }

    async function searchDestinationDirect(query) {
      const suggestionsBox = document.getElementById('suggestions');
      suggestionsBox.innerHTML = '<div class="suggestion-item">🔍 กำลังค้นหา...</div>';
      suggestionsBox.style.display = 'block';

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=th&limit=5&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        suggestionsBox.innerHTML = '';

        if (!data || data.length === 0) {
          suggestionsBox.innerHTML = '<div class="suggestion-item">❌ ไม่พบสถานที่</div>';
          aiSpeak("ไม่พบสถานที่ที่ต้องการครับ", () => resumeListening());
          return;
        }

        if (isProcessingCommand) {
          selectDestination(parseFloat(data[0].lat), parseFloat(data[0].lon), data[0].display_name);
        } else {
          data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.innerHTML = `📍 <strong>${item.display_name.split(',')[0]}</strong><br><small style="opacity:0.7">${item.display_name}</small>`;
            div.onclick = () => selectDestination(parseFloat(item.lat), parseFloat(item.lon), item.display_name);
            suggestionsBox.appendChild(div);
          });
        }
      } catch (e) {
        suggestionsBox.innerHTML = '<div class="suggestion-item">⚠️ เชื่อมต่อขัดข้อง</div>';
        aiSpeak("ค้นหาขัดข้อง กรุณาลองใหม่ครับ", () => resumeListening());
      }
    }

    function selectDestination(destLat, destLng, displayName) {
      document.getElementById('suggestions').style.display = 'none';
      document.getElementById('dest-input').value = displayName.split(',')[0];
      
      // ปรับมุมมองปักหมุดจุดหมาย
      map.flyTo({ center: [destLng, destLat], zoom: 17 });
      aiSpeak(`พบสถานที่แล้ว กำลังนำทางไป ${displayName.split(',')[0]}`, () => resumeListening());
    }

    function cancelNavigation() {
      document.getElementById('suggestions').style.display = 'none';
    }

    // 5. GPS Tracking Update
    function handlePosition(pos) {
      const { latitude, longitude, speed, heading, altitude } = pos.coords;
      currentLat = latitude; currentLng = longitude;
      if (heading) currentHeading = heading;

      currentSpeed = speed ? (speed * 3.6) : 0;
      if (currentSpeed > maxSpeed) maxSpeed = currentSpeed;

      document.getElementById('speed').innerText = currentSpeed.toFixed(1);
      document.getElementById('max-speed').innerText = maxSpeed.toFixed(1);
      document.getElementById('heading-val').innerText = `${Math.round(currentHeading)}°`;
      document.getElementById('altitude').innerText = altitude ? Math.round(altitude) : '--';

      vehicleMarker.setLngLat([currentLng, currentLat]);

      // อัปเดตมุมกล้องตามโหมดที่เลือกไว้ (3D หรือ 2D)
      map.easeTo({
        center: [currentLng, currentLat],
        bearing: is3DView ? currentHeading : 0,
        pitch: is3DView ? 60 : 0,
        duration: 1000
      });
    }

    function toggleTracking() {
      const btn = document.getElementById('toggle-btn');
      if (!isTracking) {
        watchId = navigator.geolocation.watchPosition(handlePosition, null, { enableHighAccuracy: true });
        isTracking = true;
        btn.innerText = "STOP TRACKING"; btn.classList.add("stop");
        aiSpeak("เริ่มระบบระบุตำแหน่ง GPS");
      } else {
        navigator.geolocation.clearWatch(watchId);
        isTracking = false;
        btn.innerText = "START TRACKING"; btn.classList.remove("stop");
      }
    }

    function speakCurrentLocation(cb) {
      aiSpeak(`ขณะนี้อยู่ที่ ละติจูด ${currentLat.toFixed(3)} ลองจิจูด ${currentLng.toFixed(3)} ความเร็ว ${currentSpeed.toFixed(1)} กิโลเมตรต่อชั่วโมง`, cb);
    }

    setInterval(() => { document.getElementById('osd-datetime').innerText = new Date().toLocaleString('th-TH'); }, 1000);
  </script>
</body>
</html>
