<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPS Turn-by-Turn Navigation & Dashcam</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Leaflet CSS & Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #0284c7;
      --border-color: #334155;
    }
    body.light-mode {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --accent-color: #2563eb;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* OSD Header Bar */
    .osd-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(0,0,0,0.85);
      color: #00ffcc;
      font-family: monospace;
      font-size: 11px;
      z-index: 2000;
    }

    /* Turn Guidance Banner */
    .nav-banner {
      display: none;
      background: #15803d;
      color: white;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: bold;
      align-items: center;
      gap: 10px;
      z-index: 2000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .nav-banner .turn-icon { font-size: 24px; }

    /* Search & Container */
    .search-container {
      position: relative;
      background: var(--card-bg);
      z-index: 1500;
      border-bottom: 1px solid var(--border-color);
    }
    .search-box {
      display: flex;
      gap: 6px;
      padding: 8px;
    }
    .search-box input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: rgba(0,0,0,0.2);
      color: var(--text-color);
      font-size: 13px;
    }
    .mode-select {
      background: #334155;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Search Suggestions List Overlay */
    .suggestions-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-top: none;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      z-index: 2500;
    }
    .suggestion-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      font-size: 12px;
      cursor: pointer;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .suggestion-item:hover, .suggestion-item:active {
      background: var(--accent-color);
      color: white;
    }

    /* Dashboard Grid */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 6px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
    }
    .card {
      background: rgba(0,0,0,0.2);
      padding: 4px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid var(--border-color);
    }
    .card.main {
      grid-column: span 4;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px;
    }
    .card .label { font-size: 9px; text-transform: uppercase; opacity: 0.8; }
    .card .value { font-size: 18px; font-weight: 800; }
    .card.main .value { font-size: 40px; font-weight: 900; }

    /* Controls Bar */
    .controls {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      background: var(--card-bg);
      overflow-x: auto;
      z-index: 1000;
      border-bottom: 1px solid var(--border-color);
    }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn.primary { background: #22c55e; }
    .btn.stop { background: #ef4444; }
    .btn.active { background: #0284c7; }

    /* Viewport */
    .viewport { flex: 1; position: relative; width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; background: #090d16; z-index: 1; }
    
    #camera-preview {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 130px;
      height: 95px;
      border-radius: 8px;
      border: 2px solid var(--accent-color);
      z-index: 1001;
      object-fit: cover;
      display: none;
      background: #000;
    }

    .vehicle-icon {
      transition: transform 0.3s ease;
      font-size: 28px;
      text-align: center;
      line-height: 28px;
    }

    .leaflet-routing-container { display: none !important; }
  </style>
</head>
<body>

  <!-- OSD Overlay Header -->
  <div class="osd-bar">
    <span id="osd-datetime">00/00/0000 00:00:00</span>
    <span id="osd-mode">🚗 CAR MODE</span>
    <span id="osd-weather">🌡️ --°C</span>
  </div>

  <!-- Turn-by-Turn Navigation Banner -->
  <div id="nav-banner" class="nav-banner">
    <span class="turn-icon" id="nav-icon">⬆️</span>
    <div>
      <div id="nav-text">กำลังค้นหาเส้นทาง...</div>
      <div id="nav-dist" style="font-size: 12px; opacity: 0.9;">-- ม.</div>
    </div>
  </div>

  <!-- Search & Suggestions Box -->
  <div class="search-container">
    <div class="search-box">
      <select id="transport-mode" class="mode-select" onchange="changeTransportMode()">
        <option value="car">🚗 รถยนต์ (Car)</option>
        <option value="motorcycle">🛵 มอเตอร์ไซค์ (Bike)</option>
        <option value="bicycle">🚲 จักรยาน (Bicycle)</option>
        <option value="walk">🚶 เดิน/วิ่ง (Walk)</option>
        <option value="boat">🛥️ เรือ (Boat)</option>
        <option value="plane">✈️ เครื่องบิน (Plane)</option>
      </select>
      <input type="text" id="dest-input" placeholder="พิมพ์สถานที่ แล้วกดค้นหา..." onkeypress="if(event.key==='Enter') searchDestination()">
      <button class="btn primary" onclick="searchDestination()">🔍 ค้นหา</button>
      <button class="btn stop" onclick="cancelNavigation()">ยกเลิก</button>
    </div>
    <!-- กล่องแสดงรายการตัวเลือกสถานที่ -->
    <div id="suggestions" class="suggestions-list"></div>
  </div>

  <!-- Real-time Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="card main">
      <div class="label">SPEED</div>
      <div class="value" id="speed">0.0</div>
      <span style="font-size: 10px;" id="speed-unit">km/h</span>
    </div>
    <div class="card">
      <div class="label">MAX</div>
      <div class="value" id="max-speed">0.0</div>
    </div>
    <div class="card">
      <div class="label">DIST</div>
      <div class="value" id="distance">0.00</div>
    </div>
    <div class="card">
      <div class="label">ACC</div>
      <div class="value" id="accuracy">--</div>
    </div>
    <div class="card">
      <div class="label">ALT</div>
      <div class="value" id="altitude">--</div>
    </div>
  </div>

  <!-- Controls Panel -->
  <div class="controls">
    <button class="btn primary" id="toggle-btn" onclick="toggleTracking()">START TRACKING</button>
    <button class="btn" id="btn-camera" onclick="toggleCamera()">📷 กล้องหน้ารถ</button>
    <button class="btn" id="btn-rec" onclick="toggleRecord()" disabled>🔴 บันทึกวิดีโอ</button>
    <button class="btn" id="btn-mode" onclick="toggleDayNight()">🌙 โหมดกลางคืน</button>
    <button class="btn" onclick="speakCurrentLocation()">🗣️ บอกตำแหน่ง</button>
    <button class="btn" onclick="exportGPX()">💾 EXPORT GPX</button>
  </div>

  <!-- Map Viewport -->
  <div class="viewport">
    <div id="map"></div>
    <video id="camera-preview" autoplay playsinline muted></video>
  </div>

  <!-- JS Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script>
    let watchId = null;
    let isTracking = false;
    let currentLat = 13.7563, currentLng = 100.5018;
    let currentHeading = 0;
    let currentSpeed = 0;
    let maxSpeed = 0;
    let selectedMode = 'car';
    let routingControl = null;
    let currentInstructions = [];
    let nextInstructionIndex = 0;
    let wakeLock = null;

    const vehicleIcons = { car: '🚗', motorcycle: '🛵', bicycle: '🚲', walk: '🚶', boat: '🛥️', plane: '✈️' };

    // Initialize Map
    const map = L.map('map', { zoomControl: false }).setView([currentLat, currentLng], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    function createVehicleMarker(emoji, heading) {
      return L.divIcon({
        className: 'custom-vehicle-marker',
        html: `<div class="vehicle-icon" style="transform: rotate(${heading}deg);">${emoji}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });
    }

    let vehicleMarker = L.marker([currentLat, currentLng], {
      icon: createVehicleMarker(vehicleIcons[selectedMode], currentHeading)
    }).addTo(map);

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'th-TH';
        u.rate = 1.0;
        window.speechSynthesis.speak(u);
      }
    }

    function changeTransportMode() {
      selectedMode = document.getElementById('transport-mode').value;
      document.getElementById('osd-mode').innerText = `${vehicleIcons[selectedMode]} ${selectedMode.toUpperCase()} MODE`;
      vehicleMarker.setIcon(createVehicleMarker(vehicleIcons[selectedMode], currentHeading));
      document.getElementById('speed-unit').innerText = (selectedMode === 'boat') ? 'Knots' : 'km/h';
    }

    setInterval(() => {
      document.getElementById('osd-datetime').innerText = new Date().toLocaleString('th-TH');
    }, 1000);

    // 🔍 ระบบค้นหา + แสดงช้อยตัวเลือก (Suggestions)
    async function searchDestination() {
      const query = document.getElementById('dest-input').value;
      const suggestionsBox = document.getElementById('suggestions');
      
      if (!query.trim()) return;

      suggestionsBox.innerHTML = '<div class="suggestion-item">🔍 กำลังค้นหา...</div>';
      suggestionsBox.style.display = 'block';

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=th&limit=5&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        
        suggestionsBox.innerHTML = '';

        if (data.length === 0) {
          suggestionsBox.innerHTML = '<div class="suggestion-item">❌ ไม่พบสถานที่ที่คุณค้นหา</div>';
          return;
        }

        // สร้างรายการช้อยให้ผู้ใช้เลือก
        data.forEach(item => {
          const div = document.createElement('div');
          div.className = 'suggestion-item';
          div.innerHTML = `📍 <div>${item.display_name}</div>`;
          div.onclick = () => {
            selectDestination(parseFloat(item.lat), parseFloat(item.lon), item.display_name);
          };
          suggestionsBox.appendChild(div);
        });

      } catch (e) {
        suggestionsBox.innerHTML = '<div class="suggestion-item">เกิดข้อผิดพลาดในการเชื่อมต่อ</div>';
      }
    }

    // เมื่อผู้ใช้กดเลือกสถานที่ในรายการช้อย
    function selectDestination(destLat, destLng, displayName) {
      const suggestionsBox = document.getElementById('suggestions');
      suggestionsBox.style.display = 'none'; // ซ่อนกล่องช้อย
      
      // ดึงชื่อสถานที่สั้นๆ มาแสดงในช่องอินพุต
      document.getElementById('dest-input').value = displayName.split(',')[0];
      
      startRouting(destLat, destLng);
    }

    function startRouting(destLat, destLng) {
      if (routingControl) map.removeControl(routingControl);

      let profile = 'car';
      if (selectedMode === 'bicycle') profile = 'biking';
      if (selectedMode === 'walk') profile = 'foot';

      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(currentLat, currentLng),
          L.latLng(destLat, destLng)
        ],
        router: L.Routing.osrmv1({
          serviceUrl: `https://router.project-osrm.org/route/v1`,
          profile: profile
        }),
        lineOptions: { styles: [{ color: '#0284c7', weight: 6, opacity: 0.8 }] },
        addWaypoints: false,
        createMarker: () => null
      }).addTo(map);

      routingControl.on('routesfound', function(e) {
        const routes = e.routes[0];
        currentInstructions = routes.instructions;
        nextInstructionIndex = 0;
        document.getElementById('nav-banner').style.display = 'flex';
        updateNavigationGuidance();
        speakText("เริ่มการนำทาง มุ่งหน้าตามเส้นทางที่เลือก");
      });
    }

    function cancelNavigation() {
      if (routingControl) {
        map.removeControl(routingControl);
        routingControl = null;
      }
      document.getElementById('suggestions').style.display = 'none';
      document.getElementById('nav-banner').style.display = 'none';
      speakText("ยกเลิกการนำทางเรียบร้อยแล้ว");
