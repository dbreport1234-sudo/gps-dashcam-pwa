
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPS AI Companion & Navigation</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #0284c7;
      --border-color: #334155;
    }
    body.light-mode {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --accent-color: #2563eb;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .osd-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(0,0,0,0.85);
      color: #00ffcc;
      font-family: monospace;
      font-size: 11px;
      z-index: 2000;
    }

    .nav-banner {
      display: none;
      background: #15803d;
      color: white;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: bold;
      align-items: center;
      gap: 10px;
      z-index: 2000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .search-container {
      position: relative;
      background: var(--card-bg);
      z-index: 1500;
      border-bottom: 1px solid var(--border-color);
    }
    .search-box {
      display: flex;
      gap: 6px;
      padding: 8px;
    }
    .search-box input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: rgba(0,0,0,0.2);
      color: var(--text-color);
      font-size: 13px;
    }
    .mode-select {
      background: #334155;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
    }

    .suggestions-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      z-index: 2500;
    }
    .suggestion-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      font-size: 12px;
      cursor: pointer;
    }

    /* AI Status Banner */
    .ai-banner {
      background: #1e1b4b;
      color: #a7f3d0;
      padding: 6px 12px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #312e81;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 6px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }
    .card {
      background: rgba(0,0,0,0.2);
      padding: 4px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid var(--border-color);
    }
    .card.main {
      grid-column: span 4;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px;
    }
    .card .label { font-size: 9px; opacity: 0.8; }
    .card .value { font-size: 18px; font-weight: 800; }
    .card.main .value { font-size: 38px; font-weight: 900; }

    .controls {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      background: var(--card-bg);
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
    }
    .btn {
      background: #334155;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
    }
    .btn.primary { background: #22c55e; }
    .btn.stop { background: #ef4444; }
    .btn.ai-active { background: #8b5cf6; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(139, 92, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
    }

    .viewport { flex: 1; position: relative; width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; background: #090d16; }
    
    #camera-preview {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 120px;
      height: 90px;
      border-radius: 8px;
      border: 2px solid var(--accent-color);
      z-index: 1001;
      object-fit: cover;
      display: none;
    }

    .vehicle-icon {
      transition: transform 0.3s ease;
      font-size: 28px;
      text-align: center;
    }

    .leaflet-routing-container { display: none !important; }
  </style>
</head>
<body>

  <!-- OSD Overlay -->
  <div class="osd-bar">
    <span id="osd-datetime">00/00/0000 00:00:00</span>
    <span id="osd-mode">🚗 CAR MODE</span>
    <span id="osd-status">GPS Ready</span>
  </div>

  <!-- AI Companion Bar -->
  <div class="ai-banner">
    <span>🤖 AI เพื่อนเดินทาง: <strong id="ai-status-text">ปิดอยู่</strong></span>
    <button class="btn ai-active" id="btn-ai-toggle" onclick="toggleAIAssistant()">🎙️ เปิดโหมดฟังค้าง</button>
  </div>

  <!-- Navigation Banner -->
  <div id="nav-banner" class="nav-banner">
    <span style="font-size:24px;">⬆️</span>
    <div>
      <div id="nav-text">กำลังค้นหา...</div>
      <div id="nav-dist" style="font-size: 12px;">-- ม.</div>
    </div>
  </div>

  <!-- Search Container -->
  <div class="search-container">
    <div class="search-box">
      <select id="transport-mode" class="mode-select" onchange="changeTransportMode()">
        <option value="car">🚗 รถยนต์</option>
        <option value="motorcycle">🛵 มอเตอร์ไซค์</option>
        <option value="bicycle">🚲 จักรยาน</option>
        <option value="walk">🚶 เดิน</option>
      </select>
      <input type="text" id="dest-input" placeholder="พิมพ์หรือสั่งด้วยเสียง 'นำทางไป...'" onkeypress="if(event.key==='Enter') searchDestination()">
      <button class="btn primary" onclick="searchDestination()">🔍 ค้นหา</button>
      <button class="btn stop" onclick="cancelNavigation()">ยกเลิก</button>
    </div>
    <div id="suggestions" class="suggestions-list"></div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard">
    <div class="card main">
      <div class="label">SPEED</div>
      <div class="value" id="speed">0.0</div>
      <span style="font-size: 10px;" id="speed-unit">km/h</span>
    </div>
    <div class="card">
      <div class="label">MAX</div>
      <div class="value" id="max-speed">0.0</div>
    </div>
    <div class="card">
      <div class="label">DIST</div>
      <div class="value" id="distance">0.00</div>
    </div>
    <div class="card">
      <div class="label">ALT</div>
      <div class="value" id="altitude">--</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn primary" id="toggle-btn" onclick="toggleTracking()">START TRACKING</button>
    <button class="btn" id="btn-camera" onclick="toggleCamera()">📷 กล้องหน้ารถ</button>
    <button class="btn" onclick="toggleDayNight()">🌙 โหมดกลางคืน</button>
    <button class="btn" onclick="speakCurrentLocation()">🗣️ บอกตำแหน่ง</button>
  </div>

  <!-- Map -->
  <div class="viewport">
    <div id="map"></div>
    <video id="camera-preview" autoplay playsinline muted></video>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script>
    let watchId = null;
    let isTracking = false;
    let currentLat = 13.7563, currentLng = 100.5018;
    let currentHeading = 0, currentSpeed = 0, maxSpeed = 0;
    let selectedMode = 'car';
    let routingControl = null;
    let currentInstructions = [];
    let isAIListening = false;
    let recognition = null;
    let startTime = null;
    let speedWarningCooldown = false;

    const vehicleIcons = { car: '🚗', motorcycle: '🛵', bicycle: '🚲', walk: '🚶' };

    const map = L.map('map', { zoomControl: false }).setView([currentLat, currentLng], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    function createVehicleMarker(emoji, heading) {
      return L.divIcon({
        className: 'custom-vehicle-marker',
        html: `<div class="vehicle-icon" style="transform: rotate(${heading}deg);">${emoji}</div>`,
        iconSize: [30, 30], iconAnchor: [15, 15]
      });
    }

    let vehicleMarker = L.marker([currentLat, currentLng], {
      icon: createVehicleMarker(vehicleIcons[selectedMode], currentHeading)
    }).addTo(map);

    function aiSpeak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'th-TH';
        u.rate = 1.0;
        u.pitch = 1.0;
        window.speechSynthesis.speak(u);
      }
    }

    // 🤖 ระบบฟังค้างโต้ตอบ (Continuous Voice Recognition)
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("เบราว์เซอร์นี้ไม่รองรับการฟังเสียงอัตโนมัติ กรุณาใช้ Chrome หรือ Edge บน Android");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'th-TH';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isAIListening = true;
        document.getElementById('ai-status-text').innerText = "กำลังฟัง...";
        document.getElementById('btn-ai-toggle').innerText = "🎙️ ปิดโหมดฟังค้าง";
      };

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const text = event.results[lastIndex][0].transcript.trim().toLowerCase();
        processVoiceCommand(text);
      };

      recognition.onerror = () => {};

      recognition.onend = () => {
        // หากเปิดโหมดฟังค้างไว้ ให้เริ่มฟังใหม่ทันทีเมื่อระบบหลุด
        if (isAIListening) {
          try { recognition.start(); } catch(e) {}
        } else {
          document.getElementById('ai-status-text').innerText = "ปิดอยู่";
          document.getElementById('btn-ai-toggle').innerText = "🎙️ เปิดโหมดฟังค้าง";
        }
      };
    }

    function toggleAIAssistant() {
      if (!recognition) initSpeechRecognition();
      
      if (!isAIListening) {
        isAIListening = true;
        try { recognition.start(); } catch(e) {}
        aiSpeak("เปิดโหมดเพื่อนเดินทางเรียบร้อยแล้ว มีอะไรให้ช่วยบอกได้เลยครับ");
      } else {
        isAIListening = false;
        try { recognition.stop(); } catch(e) {}
        aiSpeak("ปิดโหมดฟังค้างเรียบร้อยแล้ว เดินทางปลอดภัยครับ");
      }
    }

    // 🧠 สมอง AI วิเคราะห์คำสั่งเสียง
    function processVoiceCommand(text) {
      console.log("ได้ยินคำสั่ง:", text);

      if (text.includes("นำทางไป") || text.includes("ไปที่")) {
        let dest = text.replace("นำทางไป", "").replace("ไปที่", "").trim();
        document.getElementById('dest-input').value = dest;
        aiSpeak(`กำลังค้นหาเส้นทางไป ${dest}`);
        searchDestination();
      } else if (text.includes("อยู่ที่ไหน") || text.includes("ตำแหน่ง")) {
        speakCurrentLocation();
      } else if (text.includes("กี่กิโล") || text.includes("อีกนานไหม") || text.includes("กี่นาที")) {
        if (currentInstructions.length > 0) {
          aiSpeak(`กำลังนำทางครับ ดูระยะทางย่อยล่าสุดบนหน้าจอได้เลย`);
        } else {
          aiSpeak("ตอนนี้ยังไม่ได้ตั้งค่าจุดหมายนำทางครับ สั่งให้ผมนำทางได้นะ");
        }
      } else if (text.includes("ยกเลิก") || text.includes("หยุดนำทาง")) {
        cancelNavigation();
      } else if (text.includes("เหงา") || text.includes("ชวนคุย") || text.includes("ง่วง")) {
        aiSpeak("ขับรถไกลๆ ถ้าง่วงอย่าฝืนนะครับ มองหาปั๊มข้างหน้าแวะพักจิบกาแฟสักแก้วดีกว่าครับ");
      }
    }

    // 🔍 ค้นหา + รายการตัวเลือกสถานที่
    async function searchDestination() {
      const query = document.getElementById('dest-input').value;
      const suggestionsBox = document.getElementById('suggestions');
      if (!query.trim()) return;

      suggestionsBox.innerHTML = '<div class="suggestion-item">🔍 กำลังค้นหา...</div>';
      suggestionsBox.style.display = 'block';

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=th&limit=5&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        suggestionsBox.innerHTML = '';

        if (data.length === 0) {
          suggestionsBox.innerHTML = '<div class="suggestion-item">❌ ไม่พบสถานที่</div>';
          aiSpeak("ขออภัยครับ ไม่พบสถานที่ที่คุณค้นหา");
          return;
        }

        data.forEach(item => {
          const div = document.createElement('div');
          div.className = 'suggestion-item';
          div.innerHTML = `📍 <strong>${item.display_name.split(',')[0]}</strong><br><small style="opacity:0.7">${item.display_name}</small>`;
          div.onclick = () => selectDestination(parseFloat(item.lat), parseFloat(item.lon), item.display_name);
          suggestionsBox.appendChild(div);
        });

      } catch (e) {
        suggestionsBox.innerHTML = '<div class="suggestion-item">เกิดข้อผิดพลาด</div>';
      }
    }

    function selectDestination(destLat, destLng, displayName) {
      document.getElementById('suggestions').style.display = 'none';
      document.getElementById('dest-input').value = displayName.split(',')[0];
      startRouting(destLat, destLng);
    }

    function startRouting(destLat, destLng) {
      if (routingControl) map.removeControl(routingControl);
      routingControl = L.Routing.control({
        waypoints: [L.latLng(currentLat, currentLng), L.latLng(destLat, destLng)],
        router: L.Routing.osrmv1({ serviceUrl: `https://router.project-osrm.org/route/v1`, profile: selectedMode === 'walk' ? 'foot' : 'car' }),
        lineOptions: { styles: [{ color: '#0284c7', weight: 6 }] },
        addWaypoints: false, createMarker: () => null
      }).addTo(map);

      routingControl.on('routesfound', (e) => {
        currentInstructions = e.routes[0].instructions;
        document.getElementById('nav-banner').style.display = 'flex';
        aiSpeak("วางเส้นทางเรียบร้อยครับ เริ่มออกเดินทางได้เลย");
      });
    }

    function cancelNavigation() {
      if (routingControl) map.removeControl(routingControl);
      document.getElementById('nav-banner').style.display = 'none';
      aiSpeak("ยกเลิกการนำทางแล้วครับ");
    }

    function handlePosition(pos) {
      const { latitude, longitude, speed, heading, altitude } = pos.coords;
      currentLat = latitude; currentLng = longitude;
      if (heading) currentHeading = heading;

      currentSpeed = speed ? (speed * 3.6) : 0;
      if (currentSpeed > maxSpeed) maxSpeed = currentSpeed;

      document.getElementById('speed').innerText = currentSpeed.toFixed(1);
      document.getElementById('max-speed').innerText = maxSpeed.toFixed(1);
      document.getElementById('altitude').innerText = altitude ? Math.round(altitude) : '--';

      vehicleMarker.setLatLng([latitude, longitude]);
      vehicleMarker.setIcon(createVehicleMarker(vehicleIcons[selectedMode], currentHeading));
      map.panTo([latitude, longitude]);

      // ⚠️ AI แจ้งเตือนความเร็วเกินแบบอัตโนมัติ
      if (currentSpeed > 100 && !speedWarningCooldown) {
        aiSpeak("ความเร็วเกิน 100 กิโลเมตรต่อชั่วโมงแล้วนะครับ ระวังความปลอดภัยด้วยครับ");
        speedWarningCooldown = true;
        setTimeout(() => { speedWarningCooldown = false; }, 60000); // เตือนซ้ำได้ทุก 1 นาที
      }
    }

    function toggleTracking() {
      const btn = document.getElementById('toggle-btn');
      if (!isTracking) {
        startTime = new Date();
        watchId = navigator.geolocation.watchPosition(handlePosition, null, { enableHighAccuracy: true });
        isTracking = true;
        btn.innerText = "STOP TRACKING"; btn.classList.add("stop");
        aiSpeak("เริ่มเปิดระบบติดตามตำแหน่งเดินทาง");
      } else {
        navigator.geolocation.clearWatch(watchId);
        isTracking = false;
        btn.innerText = "START TRACKING"; btn.classList.remove("stop");
      }
    }

    let cameraStream = null;
    async function toggleCamera() {
      const v = document.getElementById('camera-preview');
      if (!cameraStream) {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        v.srcObject = cameraStream; v.style.display = 'block';
      } else {
        cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; v.style.display = 'none';
      }
    }

    function speakCurrentLocation() { aiSpeak(`ขณะนี้ท่านอยู่ที่ พิกัด ${currentLat.toFixed(4)}, ${currentLng.toFixed(4)} ความเร็วปัจจุบัน ${currentSpeed.toFixed(1)} กิโลเมตรต่อชั่วโมง`); }
    function toggleDayNight() { document.body.classList.toggle('light-mode'); }
    function changeTransportMode() { selectedMode = document.getElementById('transport-mode').value; }

    setInterval(() => { document.getElementById('osd-datetime').innerText = new Date().toLocaleString('th-TH'); }, 1000);
  </script>
</body>
</html>
