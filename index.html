<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D GPS Navigation System</title>
  
  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
      margin: 0; padding: 0;
    }
    body, html {
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      color: #fff;
    }
    
    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
    }

    /* HUD Header Panel */
    .hud-header {
      position: absolute;
      top: 15px; left: 15px; right: 15px;
      z-index: 10;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    
    .nav-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .turn-icon {
      width: 45px; height: 45px;
      background: #238636;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
    }
    .nav-text h2 { font-size: 1.1rem; font-weight: 600; color: #58a6ff; }
    .nav-text p { font-size: 0.85rem; color: #8b949e; }

    .speed-badge {
      text-align: right;
    }
    .speed-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #3fb950;
      line-height: 1;
    }
    .speed-unit { font-size: 0.75rem; color: #8b949e; }

    /* HUD Bottom Controls */
    .hud-bottom {
      position: absolute;
      bottom: 25px; left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-hud {
      background: transparent;
      border: none;
      color: #c9d1d9;
      font-size: 1.2rem;
      width: 42px; height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
    }
    .btn-hud:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .btn-hud.active { background: #1f6feb; color: #fff; }

    /* Custom 3D Vehicle Marker */
    .vehicle-marker {
      width: 40px; height: 40px;
      background: radial-gradient(circle, rgba(58,166,255,0.4) 0%, rgba(0,0,0,0) 70%);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s linear;
    }
    .vehicle-icon {
      font-size: 1.8rem;
      color: #58a6ff;
      filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.8));
    }
  </style>
</head>
<body>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Top HUD Panel -->
  <div class="hud-header">
    <div class="nav-info">
      <div class="turn-icon"><i class="fa-solid fa-arrow-up"></i></div>
      <div class="nav-text">
        <h2 id="status-text">ระบบนำทาง 3D พร้อมใช้งาน</h2>
        <p id="sub-status">กำลังรอสัญญาณ GPS...</p>
      </div>
    </div>
    <div class="speed-badge">
      <div class="speed-value" id="speed-display">0</div>
      <div class="speed-unit">KM/H</div>
    </div>
  </div>

  <!-- Bottom HUD Controls -->
  <div class="hud-bottom">
    <button class="btn-hud active" id="btn-lock" title="Recenter / Lock Track">
      <i class="fa-solid fa-location-arrow"></i>
    </button>
    <button class="btn-hud" id="btn-toggle-3d" title="Toggle 2D/3D Pitch">
      <i class="fa-solid fa-cube"></i>
    </button>
    <button class="btn-hud" id="btn-mic" title="Voice Command">
      <i class="fa-solid fa-microphone"></i>
    </button>
  </div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <script>
    // Config ค่าเริ่มต้น
    let currentPos = [100.5018, 13.7563]; // Bangkok Default [lng, lat]
    let currentHeading = 0;
    let currentSpeed = 0;
    let isTrackingLock = true;
    let is3DMode = true;

    // 1. Initialize MapLibre GL Map (3D Perspective View)
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json', // Vector dark style
      center: currentPos,
      zoom: 17.5,
      pitch: 60,   // มุมเอียง 60 องศาแบบ 3D
      bearing: 0,  // หมุนทิศทางตามหัวรถ
      antialias: true
    });

    // 2. Custom Vehicle 3D Element Marker
    const vehicleEl = document.createElement('div');
    vehicleEl.className = 'vehicle-marker';
    vehicleEl.innerHTML = '<i class="fa-solid fa-car-side vehicle-icon"></i>';

    const marker = new maplibregl.Marker({ element: vehicleEl })
      .setLngLat(currentPos)
      .addTo(map);

    // 3. Add 3D Buildings Layer
    map.on('load', () => {
      const layers = map.getStyle().layers;
      let labelLayerId;
      for (let i = 0; i < layers.length; i++) {
        if (layers[i].type === 'symbol' && layers[i].layout['text-field']) {
          labelLayerId = layers[i].id;
          break;
        }
      }

      // แทรกตึก 3 มิติข้างทาง
      map.addLayer({
        'id': '3d-buildings',
        'source': 'carto',
        'source-layer': 'building',
        'type': 'fill-extrusion',
        'minzoom': 15,
        'paint': {
          'fill-extrusion-color': '#1f2937',
          'fill-extrusion-height': ['get', 'render_height'],
          'fill-extrusion-base': ['get', 'render_min_height'],
          'fill-extrusion-opacity': 0.75
        }
      }, labelLayerId);
    });

    // 4. Smooth Camera Update Engine (3D Follow)
    function updateNavigationCamera(lng, lat, heading, speed) {
      currentPos = [lng, lat];
      currentHeading = heading || currentHeading;
      currentSpeed = Math.round(speed || 0);

      // แสดงค่าความเร็ว
      document.getElementById('speed-display').innerText = currentSpeed;

      // ปรับ Zoom Dynamic ตามความเร็วรถ
      let targetZoom = 17.5;
      if (currentSpeed > 80) targetZoom = 15.5;
      else if (currentSpeed > 50) targetZoom = 16.5;

      // อัปเดตตำแหน่งไอคอนรถ
      marker.setLngLat(currentPos);

      // ถ้าเปิดโหมด Lock ให้หมุนแผนที่เอียงตามหัวรถตลอดเวลา
      if (isTrackingLock) {
        map.easeTo({
          center: currentPos,
          bearing: currentHeading, // หมุนแผนที่ตามทิศรถ
          pitch: is3DMode ? 60 : 0, // เอียง 3D
          zoom: targetZoom,
          duration: 1000,
          easing: (t) => t
        });
      }
    }

    // 5. Real-time GPS Watcher
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const heading = position.coords.heading || 0;
          const speed = (position.coords.speed || 0) * 3.6; // แปลง m/s เป็น km/h

          document.getElementById('status-text').innerText = "กำลังนำทางแบบ 3D";
          document.getElementById('sub-status').innerText = `พิกัด: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;

          updateNavigationCamera(lng, lat, heading, speed);
        },
        (error) => {
          console.warn("GPS Error:", error.message);
          document.getElementById('sub-status').innerText = "สัญญาณ GPS ขัดข้อง (ใช้โหมดจำลอง)";
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    // 6. HUD UI Event Handlers
    document.getElementById('btn-lock').addEventListener('click', function() {
      isTrackingLock = true;
      this.classList.add('active');
      map.easeTo({ center: currentPos, bearing: currentHeading, pitch: is3DMode ? 60 : 0, duration: 800 });
    });

    document.getElementById('btn-toggle-3d').addEventListener('click', function() {
      is3DMode = !is3DMode;
      this.classList.toggle('active', is3DMode);
      map.easeTo({ pitch: is3DMode ? 60 : 0, duration: 600 });
    });

    // ปลด Lock Tracking เมื่อผู้ใช้เอานิ้วไปเลื่อนแผนที่เอง
    map.on('dragstart', () => {
      isTrackingLock = false;
      document.getElementById('btn-lock').classList.remove('active');
    });

    // Voice Command Placeholder
    document.getElementById('btn-mic').addEventListener('click', () => {
      alert("ระบบรับคำสั่งเสียง AI พร้อมเชื่อมต่อแล้ว");
    });
  </script>
</body>
</html>
